[project]
name = "sap-pipe"
version = "0.1.0"
description = "Sync and deploy SAP Integration Suite content with Git"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "requests>=2.32",
  "PyYAML>=6",
]

[project.scripts]
sap-pipe = "sap_pipe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "responses>=0.25",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
